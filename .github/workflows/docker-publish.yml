name: Docker Publish

on:
  schedule:
    - cron: '15 9 * * *'
  push:
    branches:
      - develop
      - main
    tags:
      - 'v*.*.*'
  pull_request:
    branches:
      - develop
      - main
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  test-containers:
    name: Run & Validate Containers
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Create SSH directory for container mount
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh

      - name: Validate Dev Container & Script JSON Configurations
        run: |
          echo "==> Validating .devcontainer/devcontainer.json..."
          python3 -m json.tool .devcontainer/devcontainer.json > /dev/null

          echo "==> Validating development/scripts/apps/apps.json..."
          python3 -m json.tool development/scripts/apps/apps.json > /dev/null

          echo "==> Validating all development/scripts/sites/*.json..."
          for f in development/scripts/sites/*.json; do
            [ -f "$f" ] || continue
            python3 -m json.tool "$f" > /dev/null
            echo "  [OK] $f"
          done

      - name: Start Dev Container Stack (Docker Compose)
        run: |
          echo "==> Starting containers via Docker Compose..."
          cd .devcontainer
          docker compose up -d --build
          docker compose ps

      - name: Verify Services Health & Readiness
        run: |
          echo "==> Waiting for MariaDB..."
          timeout 60s bash -c '
            until docker compose -f .devcontainer/docker-compose.yml exec -T mariadb mysqladmin ping -h localhost -uroot -p123 --silent 2>/dev/null; do
              echo "Waiting for MariaDB..."
              sleep 2
            done
          '
          echo "MariaDB is ready."

          echo "==> Verifying Redis Cache & Queue..."
          docker compose -f .devcontainer/docker-compose.yml exec -T redis-cache redis-cli ping
          docker compose -f .devcontainer/docker-compose.yml exec -T redis-queue redis-cli ping

      - name: Test Pre-installed Tools in Frappe Container (glab, gh, uv, pre-commit)
        run: |
          echo "==> Verifying installed tooling inside container..."
          docker compose -f .devcontainer/docker-compose.yml exec -T frappe bash -c "
            set -eu
            echo 'Checking Git:' && git --version
            echo 'Checking GitLab CLI:' && glab --version
            echo 'Checking GitHub CLI:' && gh --version
            echo 'Checking pre-commit:' && pre-commit --version
            echo 'Checking uv:' && uv --version
            echo 'Checking Python:' && python3 --version
            echo 'Checking Node:' && node -v
          "

      - name: Test Dev Container Lifecycle Scripts
        run: |
          echo "==> Testing devcontainer-post-create.sh in container..."
          docker compose -f .devcontainer/docker-compose.yml exec -T frappe bash /usr/local/bin/devcontainer-post-create.sh

          echo "==> Testing devcontainer-post-start.sh in container..."
          docker compose -f .devcontainer/docker-compose.yml exec -T frappe bash /usr/local/bin/devcontainer-post-start.sh

      - name: Test Script Runner & Automation Scripts
        run: |
          echo "==> Testing bash syntax of all shell scripts (bash -n)..."
          docker compose -f .devcontainer/docker-compose.yml exec -T frappe bash -c "
            set -eu
            find /workspace -name '*.sh' -exec bash -n {} +
            echo 'All shell scripts syntax validated.'
          "

          echo "==> Testing switch-site-app-refs.sh handling..."
          docker compose -f .devcontainer/docker-compose.yml exec -T frappe bash -c "
            set -eu
            cd /workspace/development

            # 1. Test argument validation when bench apps directory does not exist
            if bash scripts/switch-site-app-refs.sh non-existent-site 2>&1 | grep -q 'Bench apps directory not found'; then
              echo 'switch-site-app-refs.sh correctly handles missing bench apps directory.'
            else
              echo 'switch-site-app-refs.sh validation failed!'
              exit 1
            fi

            # 2. Test site config resolution and validation with mock bench apps directory
            MOCK_BENCH=\$(mktemp -d)
            mkdir -p \"\$MOCK_BENCH/apps\"
            if BENCH_DIR=\"\$MOCK_BENCH\" bash scripts/switch-site-app-refs.sh non-existent-config 2>&1 | grep -q 'Config not found'; then
              echo 'switch-site-app-refs.sh correctly rejects invalid config.'
            else
              echo 'switch-site-app-refs.sh invalid config test failed!'
              rm -rf \"\$MOCK_BENCH\"
              exit 1
            fi
            rm -rf \"\$MOCK_BENCH\"
          "

          echo "==> Testing installer.sh non-interactive guard..."
          docker compose -f .devcontainer/docker-compose.yml exec -T frappe bash -c "
            set -eu
            cd /workspace/development
            # installer.sh is interactive-only and should safely abort when unexpected arguments are passed
            if bash installer.sh --unexpected-flag 2>&1 | grep -q 'installer.sh is interactive now'; then
              echo 'installer.sh guard correctly prevented unprompted execution.'
            else
              echo 'installer.sh interactive guard failed!'
              exit 1
            fi
          "

      - name: Teardown Dev Container Stack
        if: always()
        run: |
          cd .devcontainer
          docker compose down -v

  publish:
    name: Build & Publish Image to GHCR
    needs: test-containers
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install cosign
        if: github.event_name != 'pull_request'
        uses: sigstore/cosign-installer@59acb6260d9c0ba8f4a2f9d9b48431a222b68e20 # v3.5.0
        with:
          cosign-release: 'v2.2.4'

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f95db51fddba0c2d1ec667646a06c2ce06100226 # v3.0.0

      - name: Log into registry ${{ env.REGISTRY }}
        if: github.event_name != 'pull_request'
        uses: docker/login-action@343f7c4344506bcbf9b4de18042ae17996df046d # v3.0.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@96383f45573cb7f253c731d3b3ab81c87ef81934 # v5.0.0
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}

      - name: Build and push Docker image
        id: build-and-push
        uses: docker/build-push-action@0565240e2d4ab88bba5387d719585280857ece09 # v5.0.0
        with:
          context: .devcontainer
          file: .devcontainer/Dockerfile
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Sign the published Docker image
        if: ${{ github.event_name != 'pull_request' }}
        env:
          TAGS: ${{ steps.meta.outputs.tags }}
          DIGEST: ${{ steps.build-and-push.outputs.digest }}
        run: echo "${TAGS}" | xargs -I {} cosign sign --yes {}@${DIGEST}
